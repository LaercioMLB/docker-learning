services:
  nginx:
    image: nginx:latest
    container_name: proxy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configuração principal
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Virtual hosts
      - ./nginx/conf.d:/etc/nginx/conf.d

      # Arquivos do site
      - ./html:/usr/share/nginx/html

    networks:
      - web

networks:
  web:
    driver: bridge