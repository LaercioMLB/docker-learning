# Define configuracoes globais do processo do HAProxy.
global
    # Envia os logs para a saida padrao do container.
    log stdout format raw local0

# Define configuracoes padrao usadas pelas secoes frontend, backend e listen.
defaults
    # Usa a configuracao de log definida no bloco global.
    log global
    # Opera em modo HTTP, permitindo interpretar requisicoes e respostas HTTP.
    mode http
    # Ativa logs detalhados para trafego HTTP.
    option httplog
    # Evita registrar conexoes vazias ou sem requisicao.
    option dontlognull
    # Tempo maximo para conectar o HAProxy a um servidor backend.
    timeout connect 5s
    # Tempo maximo de inatividade aceito na conexao com o cliente.
    timeout client 30s
    # Tempo maximo de inatividade aceito na conexao com o servidor backend.
    timeout server 30s

# Define a entrada principal das requisicoes da aplicacao.
frontend welcome_frontend
    # Faz o HAProxy escutar na porta 80 dentro do container.
    bind *:80
    # Envia todo o trafego recebido para o backend welcome_backends.
    default_backend welcome_backends

# Define o grupo de servidores que atendem a aplicacao React.
backend welcome_backends
    # Distribui novas sessoes alternando entre os servidores disponiveis.
    balance roundrobin
    # Insere um cookie para manter o mesmo navegador no mesmo backend.
    cookie SERVERID insert indirect nocache
    # Verifica a saude dos backends fazendo uma requisicao HTTP GET /.
    option httpchk GET /
    # Registra o frontend azul como servidor backend e ativa health check.
    server welcome_blue welcome-blue:80 check cookie blue
    # Registra o frontend verde como servidor backend e ativa health check.
    server welcome_green welcome-green:80 check cookie green

# Define uma pagina HTTP separada para estatisticas do HAProxy.
listen stats
    # Faz o painel de estatisticas escutar na porta 8404 dentro do container.
    bind *:8404
    # Habilita a pagina de estatisticas.
    stats enable
    # Publica a pagina de estatisticas na rota raiz.
    stats uri /
    # Atualiza automaticamente a pagina de estatisticas a cada 5 segundos.
    stats refresh 5s
